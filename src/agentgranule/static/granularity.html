<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGranule · 粒度控制</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#17332e;background:#f5f7f2;accent-color:#196c56}
*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:0 auto;padding:48px 24px}header{margin-bottom:30px}.brand{font-size:12px;letter-spacing:2px;color:#526e64}h1{font-size:34px;margin:10px 0}p{color:#52645d;line-height:1.6}section{background:white;border:1px solid #dbe4dc;border-radius:16px;padding:28px;margin:18px 0}.row{display:flex;gap:20px}.row>div{flex:1;min-width:0}label{display:block;font-weight:600;margin-bottom:10px}select,input[type=text]{width:100%;padding:11px;border:1px solid #b8c9be;border-radius:8px;font:inherit;background:#fff}input[type=range]{width:100%;margin:18px 0;height:24px;cursor:pointer}input[type=checkbox]{margin-right:8px}.control{margin-top:28px}.value{float:right;color:#196c56}.scale{display:flex;justify-content:space-between;font-size:13px;color:#64766d}.hint{font-size:13px}.badge{display:inline-block;padding:5px 10px;border-radius:30px;background:#eaf2e9;font-size:12px;color:#3c6450}button{font:inherit;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;background:#196c56;color:white}button:disabled{background:#a8b9ad;cursor:default}.secondary{background:#eaf2e9;color:#196c56}footer{margin-top:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}#status{font-size:14px;line-height:1.5}details summary{cursor:pointer}details .row{margin:20px 0}pre{white-space:pre-wrap;font-size:12px;background:#f5f7f2;padding:16px;border-radius:8px;overflow-wrap:anywhere}:focus-visible{outline:3px solid #dfab53;outline-offset:3px}@media(max-width:600px){main{padding:24px 16px}.row{flex-direction:column;gap:16px}section{padding:20px}h1{font-size:28px}}
</style>
<main>
<header><div class="brand">AGENTGRANULE</div><h1>让处理粒度由你决定</h1><p>选择模块与处理方向，拖动滑块预览，保存后用于任务执行。</p></header>
<section>
<div class="row"><div><label for="module">处理模块</label><select id="module"></select></div><div><label for="direction">处理方向</label><input id="direction" type="text" value="classification" list="directions"><datalist id="directions"></datalist></div></div>
<p><span class="badge" id="source">正在加载</span></p>
<div id="controls">
<div class="control"><label for="detail">详细程度 <output class="value" id="detailValue"></output></label><input id="detail" type="range" min="0" max="2" step="1" value="1"><div class="scale"><span>简要</span><span>标准</span><span>详细</span></div><p id="customDetail" class="hint"></p></div>
<div class="control"><label><input id="countEnabled" type="checkbox">设置列举数目 <output class="value" id="countValue"></output></label><input id="count" aria-label="列举数目" type="range" min="1" max="20" step="1" value="3"><div class="scale"><span>1 项</span><span id="countMax">20 项</span></div></div>
<div class="control"><label><input id="depthEnabled" type="checkbox">限制展开深度 <output class="value" id="depthValue"></output></label><input id="depth" aria-label="展开深度" type="range" min="1" max="8" step="1" value="2"><div class="scale"><span>1 层</span><span id="depthMax">8 层</span></div></div>
<footer><button id="save" disabled>保存粒度设置</button><button id="reload" class="secondary">重新加载</button><span id="status" role="status" aria-live="polite"></span></footer>
<p class="hint">保存会记录为人工设置；受影响的任务及其后继需要重新处理。自定义参数会保留。</p>
<details><summary>查看参数预览</summary><pre id="preview"></pre></details>
</div>
</section>
<section><details id="newModule"><summary>创建新任务模块</summary><div class="row"><div><label for="title">任务名称</label><input id="title" type="text" placeholder="例如：评估项目方案"></div><div><label for="description">模块描述</label><input id="description" type="text" placeholder="例如：分析优点与缺点"></div></div><button id="create">创建模块</button><p id="createStatus" role="status"></p></details></section>
</main>
<script>
const el=id=>document.getElementById(id),levels=['brief','standard','detailed'],labels=['简要','标准','详细'];
let current=null,detailChanged=false,loading=false,epoch=0,saving=false;
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}
function parameters(){const p={...current.parameters};if(detailChanged)p.detail_level=levels[Number(el('detail').value)];if(el('countEnabled').checked)p.count=Number(el('count').value);else delete p.count;if(el('depthEnabled').checked)p.max_depth=Number(el('depth').value);else delete p.max_depth;return p}
function render(){if(!current)return;el('detailValue').textContent=detailChanged?labels[Number(el('detail').value)]:(labels[levels.indexOf(current.parameters.detail_level)]||current.parameters.detail_level||'未指定');el('count').disabled=!el('countEnabled').checked;el('depth').disabled=!el('depthEnabled').checked;el('countValue').textContent=el('countEnabled').checked?el('count').value+' 项':'不限制数目';el('depthValue').textContent=el('depthEnabled').checked?el('depth').value+' 层':'不限制深度';el('preview').textContent=JSON.stringify(parameters(),null,2);el('save').disabled=loading||saving||JSON.stringify(parameters())===JSON.stringify(current.parameters)}
function show(data){current=data;detailChanged=false;const p=data.parameters,index=levels.indexOf(p.detail_level);el('detail').value=index<0?1:index;el('customDetail').textContent=index<0?'现有详细程度：'+(p.detail_level||'未指定')+'；拖动后将采用简要／标准／详细。':'';for(const [key,id,base] of [['count','count',20],['max_depth','depth',8]]){el(id+'Enabled').checked=key in p;el(id).max=Math.max(base,p[key]||1);el(id).value=p[key]||(id==='count'?3:2);el(id+'Max').textContent=el(id).max+(id==='count'?' 项':' 层')}el('source').textContent=({module:'模块人工设置',project_default:'项目方向默认',builtin_default:'内置建议'})[data.source]+' · 版本 '+data.revision;render()}
async function load(){const token=++epoch;loading=true;current=null;el('save').disabled=true;el('controls').style.opacity='.5';try{if(!el('module').value){el('status').textContent='还没有模块，请先创建。';el('newModule').open=true;return}const data=await api('/api/granularity?module_id='+encodeURIComponent(el('module').value)+'&direction='+encodeURIComponent(el('direction').value));if(token!==epoch)return;loading=false;show(data);el('status').textContent='已加载当前设置。'}catch(error){if(token===epoch)el('status').textContent=error.message}finally{if(token===epoch){loading=false;el('controls').style.opacity='1';render()}}}
async function modules(selected){const data=await api('/api/modules');el('module').replaceChildren(...data.modules.map(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.title+' / '+m.description;return o}));el('directions').replaceChildren(...data.directions.map(d=>{const o=document.createElement('option');o.value=d;return o}));if(selected)el('module').value=selected;await load()}
for(const id of ['detail','count','depth','countEnabled','depthEnabled'])el(id).addEventListener('input',()=>{if(!current||loading)return;if(id==='detail')detailChanged=true;el('status').textContent='预览已调整，尚未保存。';render()});
el('module').addEventListener('change',load);el('direction').addEventListener('input',()=>{++epoch;current=null;el('save').disabled=true;el('status').textContent='切换方向后请重新加载设置。'});el('direction').addEventListener('change',load);el('reload').addEventListener('click',load);
el('save').addEventListener('click',async()=>{if(!current||loading||saving)return;const token=epoch;const body={module_id:current.problem_id,direction:current.direction,parameters:parameters(),source:current.source,revision:current.revision};saving=true;render();try{const data=await api('/api/granularity',body);if(token!==epoch)return;show(data.control);el('status').textContent='已保存 · 版本 '+data.control.revision+'。受影响的任务将在后续调度时重新处理。'}catch(error){if(token===epoch)el('status').textContent=error.message}finally{saving=false;render()}});
el('create').addEventListener('click',async()=>{el('create').disabled=true;try{const data=await api('/api/module',{title:el('title').value,description:el('description').value});await modules(data.module_id);el('createStatus').textContent='模块已创建。'}catch(error){el('createStatus').textContent=error.message}finally{el('create').disabled=false}});
modules().catch(error=>el('status').textContent=error.message);
</script>
</html>
